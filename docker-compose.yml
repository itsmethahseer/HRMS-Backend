version: '3.8'

services:
  db:
    image: postgres:15
    container_name: hrms_postgres
    restart: always
    network_mode: host
    command: postgres -p 5433
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrms_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: hrms_fastapi
    restart: always
    network_mode: host
    depends_on:
      - db
    volumes:
      - .:/app
    command: /app/entrypoint.sh
    environment:
      - POSTGRES_SERVER=127.0.0.1
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hrms_db
      - POSTGRES_PORT=5433

volumes:
  postgres_data:
